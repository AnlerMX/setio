<style>
/* Layout: una sola columna tipo libreta de entrenamiento; cada rutina lleva el color de un disco olímpico */
:root{
  --bg:#ECEFED; --surface:#FFFFFF; --sunk:#E2E6E3; --ink:#15191D; --muted:#5A646D; --line:#D0D6D2;
  --equip:#9AA4AB; --ok:#1F8A4C; --danger:#B3261E;
  --p-red:#D2312A; --p-blue:#1E5DBA; --p-yellow:#E3AE17; --p-green:#2C8A4E; --p-white:#E6E9E7; --p-black:#272B30;
  --limb:#F6F4EF; --iron:#3A4047; --steel:#B9C1C7; --equip-dark:#7E888F; --panel-top:#F4F6F4; --shadow:rgba(20,25,30,.14);
  --plate:var(--p-red);
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121518; --surface:#1B1F23; --sunk:#242a2f; --ink:#E9ECEA; --muted:#9AA4AC; --line:#2F363C;
  --equip:#5F6A72; --ok:#43B571; --danger:#EF6B62;
  --p-red:#E5473F; --p-blue:#4B86E0; --p-yellow:#EDBD34; --p-green:#43A866; --p-white:#D9DDDB; --p-black:#6E7882;
  --limb:#D8DCDF; --iron:#0E1114; --steel:#59636B; --equip-dark:#3D454C; --panel-top:#2B3237; --shadow:rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121518; --surface:#1B1F23; --sunk:#242a2f; --ink:#E9ECEA; --muted:#9AA4AC; --line:#2F363C;
  --equip:#5F6A72; --ok:#43B571; --danger:#EF6B62;
  --p-red:#E5473F; --p-blue:#4B86E0; --p-yellow:#EDBD34; --p-green:#43A866; --p-white:#D9DDDB; --p-black:#6E7882;
  --limb:#D8DCDF; --iron:#0E1114; --steel:#59636B; --equip-dark:#3D454C; --panel-top:#2B3237; --shadow:rgba(0,0,0,.4);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 120px}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.01em}
button,input,a{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
a{color:inherit}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:3px solid var(--ink);margin-bottom:22px}
.top h1{font-size:clamp(34px,8vw,52px);font-weight:800;text-transform:uppercase;letter-spacing:-.005em}
.status{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:6px 0;font-weight:600;color:var(--muted)}
.back:hover{color:var(--ink)}

/* Plate */
.plate{--s:44px;width:var(--s);height:var(--s);flex:none;border-radius:50%;background:var(--plate);display:grid;place-items:center;
  box-shadow:inset 0 0 0 calc(var(--s)*.09) color-mix(in srgb,var(--plate) 70%,#000),inset 0 0 0 calc(var(--s)*.3) var(--plate);position:relative}
.plate .ico{width:60%;height:60%;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--plate) 60%,#000)}
.plate .ico svg{width:64%;height:64%}
[data-plate="white"]{--plate:var(--p-white);--plate-ink:#15191D}
[data-plate="yellow"]{--plate:var(--p-yellow);--plate-ink:#15191D}
[data-plate="red"]{--plate:var(--p-red)} [data-plate="blue"]{--plate:var(--p-blue)}
[data-plate="green"]{--plate:var(--p-green)} [data-plate="black"]{--plate:var(--p-black)}

/* Home */
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.section-h h2{font-size:26px;font-weight:700;text-transform:uppercase}
.routines{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.rcard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0;transition:transform .15s,border-color .15s}
.rcard:hover{border-color:var(--plate);transform:translateY(-1px)}
.rcard h3{font-size:21px;font-weight:700;text-transform:uppercase}
.rcard p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:left;width:100%}
.lrow .plate{--s:34px}
.lrow strong{display:block;font-weight:600}
.lrow small{color:var(--muted);font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;width:90px}
.bar i{display:block;height:100%;background:var(--plate)}
.lmeta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{border:2px dashed var(--line);border-radius:10px;padding:22px;color:var(--muted);text-align:center}

/* Routine page */
.rhead{display:flex;gap:16px;align-items:center;margin:8px 0 6px}
.rhead .plate{--s:64px}
.rhead h1{font-size:clamp(32px,7vw,46px);font-weight:800;text-transform:uppercase}
.group{margin-top:24px}
.group-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.group-h h2{font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.group-h::after{content:"";flex:1;height:2px;background:var(--line)}
.exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pict{display:block;width:100%;height:auto;background:var(--sunk)}
.excard .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.excard h3{font-family:var(--body);font-size:15px;font-weight:700;line-height:1.25}
.alias{font-size:12.5px;color:var(--muted)}
.target{font:700 15px/1 var(--display);letter-spacing:.04em;margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.photo{font:600 12.5px var(--body);color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line);white-space:nowrap}
.photo:hover{color:var(--ink);border-color:var(--ink)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--bg) 65%,transparent)}
.dock .inner{max-width:760px;margin:0 auto;display:flex;gap:10px}
.cta{flex:1;border:0;border-radius:10px;padding:15px 18px;background:var(--plate);color:var(--plate-ink,#fff);font:800 20px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.cta:hover{filter:brightness(1.06)}

/* Session */
.shead{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;margin-top:8px}
.shead .plate{--s:52px;grid-row:span 2}
.shead h1{font-size:30px;font-weight:800;text-transform:uppercase}
.shead .meta{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-variant-numeric:tabular-nums}
.shead .bar{width:120px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.ex.done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.ex-head{display:grid;grid-template-columns:auto 104px 1fr;gap:12px;align-items:center;padding:10px 12px}
.ex-head .pict{border-radius:6px}
.ex-head h3{font-family:var(--body);font-size:15.5px;font-weight:700;line-height:1.25}
.ex-head .sub{font-size:13px;color:var(--muted);margin-top:2px}
.ex-head .sub b{font-weight:600;color:var(--ink)}
.tick{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.tick svg{width:18px;height:18px}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.ex.done h3{text-decoration:line-through;text-decoration-color:var(--ok);text-decoration-thickness:2px}
.sets{border-top:1px solid var(--line);padding:8px 12px 12px;background:color-mix(in srgb,var(--sunk) 45%,var(--surface))}
.set{display:grid;grid-template-columns:32px 1fr 1fr 40px;gap:8px;align-items:end;padding:4px 0}
.set.one{grid-template-columns:32px 1fr 40px}
.set .n{font:700 18px/38px var(--display);color:var(--muted);text-align:center}
.set label{display:flex;flex-direction:column;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);gap:2px;min-width:0}
.set input{width:100%;min-width:0;height:38px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:0 10px;font-size:16px;font-variant-numeric:tabular-nums;color:var(--ink)}
.set input::placeholder{color:color-mix(in srgb,var(--muted) 60%,transparent)}
.set input:focus{outline:none;border-color:var(--plate);box-shadow:0 0 0 2px color-mix(in srgb,var(--plate) 35%,transparent)}
.stick{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--equip)}
.stick svg{width:16px;height:16px}
.stick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.set-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600}
.ghost:hover{border-color:var(--ink)}
.ghost.danger{color:var(--danger)}
.ghost.danger:hover{border-color:var(--danger)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.foot{margin-top:28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.backup{display:flex;gap:8px;flex-wrap:wrap}
label.ghost{cursor:pointer;color:var(--ink)}
@media (max-width:440px){.ex-head{grid-template-columns:auto 80px 1fr;gap:10px}.routines{grid-template-columns:1fr 1fr}.rcard{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* Busca el torso: segmento entre dos articulaciones (puntos compartidos) más cercano a la cabeza */
function torsoOf(p){
  if(p.t)return p.t;
  const d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  const cnt={};p.b.forEach(l=>{const seen={};for(let i=0;i<l.length;i+=2){const k=l[i]+','+l[i+1];if(!seen[k]){seen[k]=1;cnt[k]=(cnt[k]||0)+1}}});
  const J=q=>cnt[q[0]+','+q[1]]>1;
  let best=null,bd=1e9;
  p.b.forEach(l=>{for(let i=0;i+3<l.length;i+=2){const a=[l[i],l[i+1]],b=[l[i+2],l[i+3]];
    if(J(a)&&J(b)){const m=Math.min(d(a,p.h),d(b,p.h));if(m<bd){bd=m;best=[a,b]}}}});
  if(best)return best;
  const pts=[];p.b.forEach(l=>{for(let i=0;i<l.length;i+=2)pts.push([l[i],l[i+1]])});
  let S=pts[0];pts.forEach(q=>{if(d(q,p.h)<d(S,p.h))S=q});
  let len=0;
  p.b.forEach(l=>{for(let i=0;i+3<l.length;i+=2){const a=[l[i],l[i+1]],b=[l[i+2],l[i+3]];
    if((a[0]===S[0]&&a[1]===S[1])||(b[0]===S[0]&&b[1]===S[1])){const L=d(a,b);if(L>len){len=L;best=[a,b]}}}});
  return len>16?best:null;
}
let pictN=0;
function arrows(list){
  if(!list)return '';
  let halo='',line='',heads='';
  const head=(x,y,fx,fy)=>{const a=Math.atan2(y-fy,x-fx),L=6.5,W=0.55;
    return `<path d="M${x+Math.cos(a)*2} ${y+Math.sin(a)*2}L${(x-L*Math.cos(a-W)).toFixed(1)} ${(y-L*Math.sin(a-W)).toFixed(1)}L${(x-L*Math.cos(a+W)).toFixed(1)} ${(y-L*Math.sin(a+W)).toFixed(1)}Z"/>`};
  list.forEach(m=>{const [x1,y1,x2,y2]=m.p;const c=m.c;
    const d=c?`M${x1} ${y1}Q${c[0]} ${c[1]} ${x2} ${y2}`:`M${x1} ${y1}L${x2} ${y2}`;
    halo+=`<path d="${d}"/>`;line+=`<path d="${d}"${m.n?' stroke-dasharray="1 5"':''}/>`;
    if(!m.n){heads+=head(x2,y2,c?c[0]:x1,c?c[1]:y1);if(m.d)heads+=head(x1,y1,c?c[0]:x2,c?c[1]:y2)}});
  return `<g fill="none" stroke-linecap="round"><g stroke="var(--panel-top)" stroke-width="7" opacity=".9">${halo}</g><g stroke="var(--move,var(--plate))" stroke-width="2.8">${line}</g></g><g fill="var(--move,var(--plate))" stroke="var(--panel-top)" stroke-width="1.2" stroke-linejoin="round">${heads}</g>`;
}

<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--panel-top)"/><stop offset="1" stop-color="var(--sunk)"/></linearGradient></defs>

 <g stroke="var(--equip-dark)" stroke-width="6.5">${p.e.map(pl).join('')}</g>
 <g stroke="var(--equip)" stroke-width="4">${p.e.map(pl).join('')}</g>
</g>
${weights}
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
 <g stroke="var(--ink)" stroke-width="10.5">${all}</g>
 <g stroke="var(--ink)" stroke-width="17">${torso}</g>

<circle cx="${p.h[0]}" cy="${p.h[1]}" r="7.5" fill="var(--limb)" stroke="var(--ink)" stroke-width="2"/>

const S={mode:'loading',sessions:[],col:null,saving:0};
const LKEY='setio-v1';
function sorted(){return S.sessions.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))}
function loadLocal(){try{const v=JSON.parse(localStorage.getItem(LKEY)||'[]');return Array.isArray(v)?v:[]}catch(e){return[]}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(S.sessions))}catch(e){}}
const pending={},inflight={};
function persist(s){
  s.updatedAt=Date.now();
  if(S.mode!=='db'){saveLocal();setStatus('Guardado');return}
  clearTimeout(pending[s.id]);setStatus('Guardando…');
  pending[s.id]=setTimeout(()=>flush(s.id),500);
}
async function flush(id){
  if(inflight[id]){inflight[id].again=true;return}
  const s=S.sessions.find(x=>x.id===id);if(!s)return;
  inflight[id]={again:false};
  try{await S.col.doc(id).set(JSON.parse(JSON.stringify(s)));setStatus('Guardado')}
  catch(e){setStatus('No se pudo guardar. Revisa tu conexión.')}
  const again=inflight[id].again;delete inflight[id];if(again)flush(id);
}
async function removeSession(id){
  S.sessions=S.sessions.filter(x=>x.id!==id);
  if(S.mode==='db'){try{await S.col.doc(id).delete()}catch(e){setStatus('No se pudo borrar.')}}else saveLocal();
}
function setStatus(t){const el=document.getElementById('status');if(el)el.textContent=t}
function modeLabel(){return S.mode==='db'?'Se guarda en tu cuenta':S.mode==='local'?'Se guarda en este dispositivo':'Cargando bitácora…'}

function useLocal(){if(S.mode!=='loading')return;S.mode='local';S.sessions=loadLocal();route()}
async function initStore(){
  const timer=setTimeout(useLocal,10000);
  try{
    const use=window.claude&&window.claude.use;
    if(!use){clearTimeout(timer);return useLocal()}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const uid=user?await user.id():null;
    if(!db||!uid){clearTimeout(timer);return useLocal()}
    S.col=db.collection('data/users/'+uid);
    S.col.onSnapshot(snap=>{
      clearTimeout(timer);
      const first=S.mode!=='db';S.mode='db';
      const remote=snap.docs.map(d=>d.data()).filter(Boolean).map(d=>JSON.parse(JSON.stringify(d)));
      // conserva la versión local de sesiones con cambios sin guardar
      S.sessions=remote.map(r=>{const loc=S.sessions.find(x=>x.id===r.id);return loc&&(pending[r.id]||inflight[r.id])&&(loc.updatedAt||0)>=(r.updatedAt||0)?loc:r});
      if(first||view.kind!=='session'||!view.rendered)route();
    },()=>{clearTimeout(timer);useLocal()});
  }catch(e){clearTimeout(timer);useLocal()}
}

  const today=S.sessions.find(s=>s.routine===id&&s.date===todayKey());
  dock.hidden=false;dock.dataset.plate=r.plate;
  dock.innerHTML=`<div class="inner"><button class="cta" data-start="${id}">${today?'Continuar la de hoy':'Empezar rutina de hoy'}</button></div>`;
}

function lastFor(exId,before){
  const x=EX[exId];
  for(const s of sorted()){
    if((s.createdAt||0)>=before)continue;
    const it=s.items&&s.items[exId];if(!it)continue;
    const sets=(it.sets||[]).filter(t=>String(t.a).trim()!=='');
    if(sets.length)return{sets,date:s.date,type:x.type};
  }return null;
}
function lastText(l){
  if(!l)return '';
  const parts=l.sets.slice(0,4).map(t=>l.type==='reps'?(t.b!==''?`${t.a}×${t.b}`:`${t.a}`):l.type==='hold'?`${t.a} s`:`${t.a} min`);
  return `Última vez: <b>${esc(parts.join(' · '))}</b>${l.type==='reps'?' <span>(reps×kg)</span>':''}`;
}

function exCard(s,x){
  const it=s.items[x.id];const f=FIELDS[x.type];const last=lastFor(x.id,s.createdAt);
  const rows=it.sets.map((t,i)=>{const ph=last&&last.sets[i]||{};return `<div class="set ${f.length===1?'one':''}"><span class="n">${i+1}</span>${f.map(([k,lab])=>`<label>${lab}<input id="${s.id}-${x.id}-${i}-${k}" inputmode="decimal" autocomplete="off" data-ex="${x.id}" data-i="${i}" data-k="${k}" value="${esc(t[k])}" placeholder="${esc(ph[k]||'')}"></label>`).join('')}<button class="stick" aria-label="Serie ${i+1} hecha" aria-pressed="${!!t.ok}" data-setok="${x.id}" data-i="${i}">${CHECK}</button></div>`}).join('');
  return `<article class="ex ${it.done?'done':''}" id="ex-${x.id}">
  <div class="ex-head"><button class="tick" aria-label="Marcar ${esc(x.name)} como hecho" aria-pressed="${!!it.done}" data-done="${x.id}">${CHECK}</button>${pict(x.pose)}
  <div><h3>${x.name}</h3><div class="sub">Meta ${x.target} · <a class="photo" href="${photoUrl(x)}" target="_blank" rel="noopener">Fotos ↗</a></div>${last?`<div class="sub">${lastText(last)}</div>`:''}</div></div>
  <div class="sets">${rows}<div class="set-actions"><button class="ghost" data-add="${x.id}">+ Serie</button>${it.sets.length>1?`<button class="ghost" data-rm="${x.id}">Quitar última</button>`:''}</div></div></article>`;
}

function renderSession(id){
  const s=S.sessions.find(x=>x.id===id);
  if(!s){if(S.mode==='loading'){app.innerHTML=header()+'<div class="empty">Cargando tu bitácora…</div>';dock.hidden=true;return}return go('')}
  const r=R[s.routine];
  ensureItems(s,r);
  document.documentElement.style.setProperty('--plate',`var(--p-${r.plate})`);document.documentElement.style.setProperty('--move',r.plate==='white'?'var(--ink)':`var(--p-${r.plate})`);
  const p=progress(s);
  app.innerHTML=`<button class="back" data-go="">← Bitácora</button>
  <div class="shead" data-plate="${r.plate}">${plate(r)}<h1>${r.name}</h1>
   <div class="meta"><span>${fmtDate(s.date)}</span><span id="pg-t">${p.done}/${p.total} ejercicios</span><span class="bar"><i id="pg-b" style="width:${p.pct}%"></i></span><span id="status">${S.mode==='db'?'Guardado':modeLabel()}</span></div></div>
  ${r.groups.map(g=>`<section class="group"><div class="group-h"><h2>${g.name}</h2></div>${g.ex.map(x=>exCard(s,x)).join('')}</section>`).join('')}
  <div class="foot"><span>Los números grises son lo que hiciste la vez pasada.</span><span id="delbox"><button class="ghost danger" data-del="ask">Borrar este entrenamiento</button></span></div>`;
  dock.hidden=true;
  view.rendered=true;
}
function ensureItems(s,r){
  s.items=s.items||{};
  r.groups.forEach(g=>g.ex.forEach(x=>{if(!s.items[x.id])s.items[x.id]={done:false,sets:Array.from({length:x.sets},()=>({a:'',b:'',ok:false}))}}));
}
function refreshProgress(s){const p=progress(s);const t=document.getElementById('pg-t'),b=document.getElementById('pg-b');if(t)t.textContent=`${p.done}/${p.total} ejercicios`;if(b)b.style.width=p.pct+'%'}
function rerenderCard(s,exId){const el=document.getElementById('ex-'+exId);if(el)el.outerHTML=exCard(s,EX[exId])}

/* ---------- Navegación ---------- */
function go(h){if(('#'+h)===location.hash||(!h&&!location.hash))route();else location.hash=h}
function route(){
  const h=location.hash.slice(1);
  document.documentElement.style.removeProperty('--plate');document.documentElement.style.removeProperty('--move');
  if(h.startsWith('r-')){view={kind:'routine'};renderRoutine(h.slice(2))}
  else if(h.startsWith('s-')){view={kind:'session',id:h.slice(2),rendered:false};renderSession(h.slice(2))}
  else{view={kind:'home'};renderHome()}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

function startRoutine(rid){
  let s=S.sessions.find(x=>x.routine===rid&&x.date===todayKey());
  if(!s){s={id:'s'+Date.now().toString(36),routine:rid,date:todayKey(),createdAt:Date.now(),items:{}};ensureItems(s,R[rid]);S.sessions.push(s);persist(s)}
  go('s-'+s.id);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(d.go!==undefined){go(d.go);return}
  if(d.start){startRoutine(d.start);return}
  const s=view.kind==='session'&&S.sessions.find(x=>x.id===view.id);if(!s)return;
  if(d.done){const it=s.items[d.done];it.done=!it.done;t.setAttribute('aria-pressed',it.done);t.closest('.ex').classList.toggle('done',it.done);refreshProgress(s);persist(s)}
  else if(d.setok){const it=s.items[d.setok];const st=it.sets[+d.i];st.ok=!st.ok;t.setAttribute('aria-pressed',st.ok);
    const all=it.sets.every(x=>x.ok);if(all!==it.done&&(all||it.done)){it.done=all;const card=t.closest('.ex');card.classList.toggle('done',all);card.querySelector('.tick').setAttribute('aria-pressed',all);refreshProgress(s)}persist(s)}
  else if(d.add){const it=s.items[d.add];const prev=it.sets[it.sets.length-1]||{};it.sets.push({a:'',b:'',ok:false});rerenderCard(s,d.add);persist(s);
    const inp=document.getElementById(`${s.id}-${d.add}-${it.sets.length-1}-a`);if(inp)inp.focus()}
  else if(d.rm){const it=s.items[d.rm];if(it.sets.length>1){it.sets.pop();rerenderCard(s,d.rm);persist(s)}}
  else if(d.del==='ask'){document.getElementById('delbox').innerHTML=`<span class="confirm">¿Borrar el entrenamiento del ${fmtShort(s.date)}? <button class="ghost danger" data-del="yes">Sí, borrar</button><button class="ghost" data-del="no">Cancelar</button></span>`}
  else if(d.del==='no'){document.getElementById('delbox').innerHTML='<button class="ghost danger" data-del="ask">Borrar este entrenamiento</button>'}
  else if(d.del==='yes'){removeSession(s.id).then(()=>go(''))}
});
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.ex)return;
  const s=view.kind==='session'&&S.sessions.find(x=>x.id===view.id);if(!s)return;
  s.items[t.dataset.ex].sets[+t.dataset.i][t.dataset.k]=t.value.trim();
  persist(s);
});

/* ---------- Respaldo ---------- */
function backupMsg(t){const el=document.getElementById('backupMsg');if(el)el.textContent=t}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-export]');if(!b)return;
  const blob=new Blob([JSON.stringify({app:'bitacora-fierros',version:1,exportedAt:new Date().toISOString(),sessions:S.sessions},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='setio-'+todayKey()+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  backupMsg('Respaldo descargado: '+S.sessions.length+' entrenamientos.');
});
document.addEventListener('change',e=>{
  if(e.target.id!=='importFile'||!e.target.files[0])return;
  const r=new FileReader();
  r.onload=()=>{try{
    const data=JSON.parse(r.result);const list=Array.isArray(data)?data:data.sessions;
    if(!Array.isArray(list))throw 0;
    let added=0;list.forEach(x=>{if(x&&x.id&&x.routine&&!S.sessions.some(y=>y.id===x.id)){S.sessions.push(x);added++}});
    saveLocal();renderHome();backupMsg(added?`Listo: se agregaron ${added} entrenamientos.`:'Ese respaldo no tenía entrenamientos nuevos.');
  }catch(err){backupMsg('Ese archivo no es un respaldo válido de la bitácora.')}};
  r.readAsText(e.target.files[0]);
});

route();
initStore();
</script>

</body>
</html>
